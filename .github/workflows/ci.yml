name: CI

# `pull_request` (never `pull_request_target`): workflows for PRs from forks run with a read-only token and
# WITHOUT repository secrets. This workflow needs no secrets at all; tests use a local fake Airtable.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment). Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  check:
    name: lint, types, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0 (version from package.json packageManager)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings=0
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - name: pnpm audit (high and critical fail the build)
        run: pnpm audit --audit-level=high

  e2e:
    name: e2e (Playwright, production build, fake Airtable)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Browser (preinstalled Chrome if the runner has it, else install Chromium; CI only)
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "PW_CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - run: pnpm e2e
        env:
          CI: "true"

  gitleaks:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      # Free for personal accounts. A repository owned by a GitHub ORGANIZATION needs a (free) GITLEAKS_LICENSE
      # secret; see docs/ops/runbook.md. Forks never receive secrets (pull_request), the scan then runs without it.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
